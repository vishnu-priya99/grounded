[project]
name = "grounded"
version = "0.1.0"
description = "Local-first, multi-agent document chat that shows its sources and checks its own work"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.60",
    "ollama>=0.4.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.19",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "html2text>=2020.1.16",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "tabulate>=0.9",
    "duckdb>=1.1",
    "rapidocr-onnxruntime>=1.4",
    "pillow>=10.4",
    "streamlit>=1.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.26,<2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "reportlab>=4.0"]
# Optional paid-API providers (LLM_PROVIDER=anthropic|openai). Not needed for
# the default fully-local Ollama path.
cloud = ["anthropic>=1.3", "openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
